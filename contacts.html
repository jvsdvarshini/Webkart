<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="contacts.css">
</head>

<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <a href="home.html" class="logo">🛒 Web<span>Kart</span></a>
        <nav>
            <a href="home.html">Home</a>
            <a href="products.html">Products</a>
       
            <a href="contacts.html" class="active">Contact</a>
        </nav>
    </header>

    <div class="contact-header">
        <h1>We'd Love to Hear From You</h1>
        <p><b>Have a Question? We are here to help.</b></p>
    </div>
    <div class="container">
        <div class="contact">
            <form action="">
                <label for="">Fullname</label>
                <br>
                <input type="text" placeholder="Enter your name" />
                <br>
                <label for="">Email Address</label>
                <br>
                <input type="email" placeholder="Enter your email" />
                <br>
                <label for="">Message</label>
                <br>
                <textarea rows="5" placeholder="Type your message here..."></textarea>
                <br>
                <button type="submit">Send Message</button>
            </form>
        </div>
        <div class="help">
            <span>
                <h4>📩Email</h4>shopora@gmail.com
            </span>
            <span>
                <h4>📞Phone</h4>9876543210
            </span>
            <span>
                <h4>📍Location</h4>Vishakapatnam, India
            </span>
            <span>
                <h4>🕑Working hours</h4>Mon - Sat : 9.00 AM - 9.00 PM<br>Sun : 10.00 AM - 6.00 PM
            </span>
        </div>
    </div>



</body>

</html>
